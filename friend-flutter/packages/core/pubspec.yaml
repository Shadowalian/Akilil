name: core
description: |
  Shared core for the Akilil Platform Flutter monorepo. Houses theming,
  networking, auth/token storage, the Jitsi session view, and Reverb
  realtime plumbing used by both the User and Professional apps.
version: 0.0.1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # ---- State management ------------------------------------------------
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ---- Networking ------------------------------------------------------
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # ---- Auth/token storage ---------------------------------------------
  flutter_secure_storage: ^9.2.2

  # ---- Realtime (Reverb is Pusher-protocol compatible) ----------------
  pusher_channels_flutter: ^2.3.0

  # ---- Video session room (Jitsi via WebView) -------------------------
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.1

  # ---- Models / serialization -----------------------------------------
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ---- Design tokens / fonts (Task 0.5 replaces google_fonts with
  # self-hosted files; google_fonts is the dev stand-in for now) --------
  google_fonts: ^6.2.1

  # ---- Misc -----------------------------------------------------------
  meta: ^1.15.0
  equatable: ^2.0.5
  intl: ^0.20.0
  uuid: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true
