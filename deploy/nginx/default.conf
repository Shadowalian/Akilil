server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 32M;
    root /var/www/web;
    index index.html;

    # Flutter web — client (user) app
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Flutter web — professional app at /pro/
    location ^~ /pro/ {
        root /var/www;
        try_files $uri $uri/ /pro/index.html;
    }

    # Filament / Livewire static assets (must NOT fall through to Flutter SPA)
    location ^~ /css/ {
        alias /var/www/html/public/css/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ^~ /js/ {
        alias /var/www/html/public/js/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ^~ /fonts/ {
        alias /var/www/html/public/fonts/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Laravel API (routes already prefixed /api)
    location ^~ /api {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param PATH_INFO "";
        fastcgi_read_timeout 120s;
    }

    # Filament admin
    location ^~ /admin {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param PATH_INFO "";
        fastcgi_read_timeout 120s;
    }

    location ^~ /livewire {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param PATH_INFO "";
    }

    location ^~ /storage/ {
        alias /var/www/html/public/storage/;
        try_files $uri =404;
    }
}
