services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: akilil
      MYSQL_USER: akilil
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 40

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql
    volumes:
      - ../friend-backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  queue:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--timeout=90"]
    volumes:
      - ../friend-backend:/var/www/html
    depends_on:
      - app

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../friend-backend:/var/www/html:ro
      - ../web:/var/www/web:ro
      - ../web-pro:/var/www/pro:ro
    depends_on:
      - app

volumes:
  mysql_data:
